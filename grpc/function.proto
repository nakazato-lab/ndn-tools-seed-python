syntax = "proto3";

package function;

service FunctionRuntime {
  rpc Execute (ExecutionRequest) returns (ExecutionResult);
}

service FunctionDeployment {
  rpc UploadPackage (PackageRequest) returns (PackageResponse);
}

message ExecutionRequest {
  string name = 1;
  repeated string args = 2;
  optional bytes binary_input = 3;
}

message ExecutionResult {
  string result = 1;
  optional bytes binary_result = 2;
}

message PackageRequest {
  oneof content {
    bytes zip_content = 1;
    string code = 2;
  }
}

message PackageResponse {}
