syntax = "proto3";

package function;

service FunctionRuntime {
  rpc ExecuteFunction (FunctionRequest) returns (FunctionResponse);
  rpc UploadPackage (PackageRequest) returns (PackageResponse);
}

message FunctionRequest {
  string name = 1;
  repeated string args = 2;
  optional bytes binary_input = 3;
}

message FunctionResponse {
  string result = 1;
  optional bytes binary_result = 2;
}

message PackageRequest {
  bytes zip_content = 1;
}

message PackageResponse {}
