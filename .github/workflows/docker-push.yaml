name: Build and Push Docker Images
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Seed Python
            context: .
            file: ./Dockerfile.seed
            image_name: ndn-seed
          - name: Function Runtime
            context: .
            file: ./function/Dockerfile.ndn
            image_name: ndn-function-runtime
          - name: Python Function Runtime
            context: .
            file: ./function/Dockerfile.python
            image_name: python-function-runtime
          - name: Function Sidecar
            context: .
            file: ./sidecar/Dockerfile
            image_name: ndn-function-sidecar
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image_name }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
