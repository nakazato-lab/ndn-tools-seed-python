name: Build and Push Docker Images
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: NFD
            context: .
            file: ./Dockerfile.nfd
            image_name: ndn-nfd
          - name: Seed Python
            context: .
            file: ./Dockerfile.seed
            image_name: ndn-seed
          - name: Edge Function
            context: ./sidecar
            file: ./sidecar/Dockerfile
            image_name: my-edge-function
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ github.event_name == 'pull_request' && 'local' || secrets.DOCKER_HUB_USER }}/${{ matrix.image_name }}:latest
